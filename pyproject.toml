[project]
name = "SINT"
version = "1.0.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "smacv2",
    "torch",
    "tqdm>=4.70.1",
]

[tool.uv.sources]
smacv2 = { git = "https://github.com/oxwhirl/smacv2.git" }
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
